<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Skill - SkillSwap</title>
</head>

<body>
    <header>
        <h1>Offer a Skill</h1>
    </header>
    <main>
        <section class="form-container">
            <form>
                <label for="skill-title">Skill Title:</label><br>
                <input type="text" id="skill-title" required><br><br>
                <label for="category">Category:</label><br>
                <select id="category"> 
<option value="programming">Programming & Code</option> 
<option value="design">Design & Graphics</option> 
<option value="academics">Academics & Math</option> 
</select><br><br>
                <label for="description">Skill Description:</label><br>
                <textarea id="description" rows="4" cols="50"></textarea><br><br>
                <button type="submit">Publish Skill</button>
            </form>
        </section>
    </main>
</body>

</html>
