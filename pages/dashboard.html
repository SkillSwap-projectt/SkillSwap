<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SkillSwap</title>
  </head>
  <body>
    <header>
      <h1>Student Dashboard</h1>
    </header>
    <main>
      <section class="stats-overview">
        <h2>Overview</h2>
        <p>Active Swaps: <strong>2</strong></p>
        <p>Pending Requests: <strong>1</strong></p>
      </section>
      <section class="swap-requests">
        <h2>Your Skill Exchanges</h2>
        <table>
          <thead>
            <tr>
              <th>Partner</th>
              <th>Offered Skill</th>
              <th>Requested Skill</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Mohammed</td>
              <td>HTML/CSS Basics</td>
              <td>C++ Debugging</td>
              <td><span>Approved</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
